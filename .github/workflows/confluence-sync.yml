name: Confluence Weekly Sync

on:
  push:
    branches: [main]
    paths:
      - '.claude/skills/**'          # Skill updates sync immediately
      - 'execution/**/*.md'          # New artifacts sync immediately
      - 'pm-os-reference/documentation/**/*.md'  # PM OS meta-docs
      - '**/README.md'
      - 'QUICK_START.md'
      - 'VALIDATION_CHECKLIST.md'
      - 'IMPLEMENTATION_STATUS.md'
      - 'AUTOMATIONS.md'
  schedule:
    - cron: '0 9 * * 1'  # Monday 9am UTC — full sweep regardless of changes
  workflow_dispatch:       # Manual trigger any time

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Confluence sync
        env:
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          CONFLUENCE_CLOUD_ID: ${{ secrets.CONFLUENCE_CLOUD_ID }}
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
        run: node scripts/confluence-sync.js

      - name: Commit updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/confluence-sync-manifest.json
          git diff --staged --quiet || git commit -m "chore: update confluence sync manifest [skip ci]"
          git push
