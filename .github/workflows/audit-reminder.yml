name: PM OS Monthly Quality Audit Reminder

# Runs on the 1st of every month at 9am UTC.
# Creates a GitHub Issue AND a Jira story so the audit doesn't get missed.
# Manual trigger also available for ad-hoc runs.
#
# Required GitHub Secrets (shared with confluence-sync.yml):
#   ATLASSIAN_EMAIL         — your Atlassian account email
#   ATLASSIAN_API_TOKEN     — Atlassian API token (not Rovo MCP token)
#   CONFLUENCE_BASE_URL     — e.g. https://yourcompany.atlassian.net
#
# Optional GitHub Variables (set under repo Settings → Variables):
#   JIRA_PROJECT_KEY        — defaults to PMOS

on:
  schedule:
    - cron: '0 9 1 * *'  # First of every month at 9am UTC
  workflow_dispatch:       # Manual trigger any time

jobs:
  create-reminders:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # ── 1. GitHub Issue ──────────────────────────────────────────────────────

      - name: Create GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            const date = '${{ steps.date.outputs.date }}';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔄 Monthly PM OS Quality Audit — ${date}`,
              body: [
                '## Monthly PM OS Quality Audit',
                '',
                `**Due**: ${date}`,
                '',
                '### How to run',
                '```',
                '/pm-os-quality-audit',
                '```',
                'Open Claude Code in your PM OS directory and invoke the skill above.',
                '',
                '### Checklist',
                '- [ ] Run `/pm-os-quality-audit` in Claude Code',
                '- [ ] Review improvement proposals saved to `execution/improvement_proposals/`',
                '- [ ] Identify any proposals to action immediately vs. defer to Phase backlog',
                '- [ ] Confirm quality dashboard updated (check Last Updated date)',
                '- [ ] Close this issue when audit is complete',
                '',
                '### What the audit checks',
                '| Check | Tool |',
                '|-------|------|',
                '| Skills inventory vs CLAUDE.md routing table | pm-os-quality-audit |',
                '| Documentation currency (ROADMAP, dashboard, README) | pm-os-quality-audit |',
                '| Open improvement proposals | pm-os-quality-audit |',
                '| Pre-push security + hygiene | scripts/pre-push (auto, every push) |',
                '| Deep commit + PII review | /release-check (periodic) |',
                '',
                '---',
                '*Auto-generated by `.github/workflows/audit-reminder.yml`*',
              ].join('\n'),
            });

      # ── 2. Jira Story ────────────────────────────────────────────────────────

      - name: Create Jira Story
        env:
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY || 'PMOS' }}
        run: |
          DATE=$(date +'%Y-%m-%d')
          AUTH=$(printf '%s:%s' "${ATLASSIAN_EMAIL}" "${ATLASSIAN_API_TOKEN}" | base64 -w 0)

          HTTP_STATUS=$(curl -s -o /tmp/jira_response.json -w "%{http_code}" \
            -X POST "${JIRA_BASE_URL%/}/rest/api/3/issue" \
            -H "Authorization: Basic ${AUTH}" \
            -H "Content-Type: application/json" \
            -d "{
              \"fields\": {
                \"project\": {\"key\": \"${JIRA_PROJECT_KEY}\"},
                \"summary\": \"Monthly PM OS Quality Audit \u2014 ${DATE}\",
                \"description\": {
                  \"type\": \"doc\",
                  \"version\": 1,
                  \"content\": [{
                    \"type\": \"paragraph\",
                    \"content\": [{
                      \"type\": \"text\",
                      \"text\": \"Run /pm-os-quality-audit in Claude Code. Review improvement proposals in execution/improvement_proposals/, confirm quality dashboard is updated, and close this ticket when done. Auto-generated by GitHub Actions on a monthly cadence.\"
                    }]
                  }]
                },
                \"issuetype\": {\"name\": \"Task\"},
                \"priority\": {\"name\": \"Medium\"},
                \"labels\": [\"maintenance\", \"audit\", \"pm-os\"]
              }
            }")

          if [ "${HTTP_STATUS}" -ge 200 ] && [ "${HTTP_STATUS}" -lt 300 ]; then
            ISSUE_KEY=$(cat /tmp/jira_response.json | grep -o '"key":"[^"]*"' | head -1 | cut -d'"' -f4)
            echo "✅ Jira story created: ${ISSUE_KEY}"
          else
            echo "⚠️ Jira ticket creation returned HTTP ${HTTP_STATUS}"
            cat /tmp/jira_response.json
            echo "Check that ATLASSIAN_EMAIL, ATLASSIAN_API_TOKEN, and CONFLUENCE_BASE_URL secrets are set correctly."
            # Non-fatal: GitHub issue was already created above
            exit 0
          fi
